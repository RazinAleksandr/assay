<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes — Assay example app</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1d2330; }
  main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
  h1 { font-size: 28px; margin: 0 0 16px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px 12px; border: 1px solid #c8ccd6; border-radius: 6px; font: inherit; }
  button { padding: 10px 16px; border: 0; border-radius: 6px; background: #2457c5; color: #fff; font: inherit; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 24px 0 0; }
  li { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid #e3e6ec;
       border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
  li button { background: #fff; color: #b42318; border: 1px solid #e3e6ec; padding: 6px 10px; }
  .error { color: #b42318; margin: 8px 0 0; min-height: 24px; }
  .empty { color: #5b6476; }
</style>
</head>
<body>
<main>
  <h1>Notes</h1>
  <form id="add">
    <input id="text" aria-label="New note" placeholder="Write a note" maxlength="200">
    <button type="submit">Add note</button>
  </form>
  <p class="error" id="error" role="alert"></p>
  <ul id="list" aria-label="Notes"></ul>
</main>
<script>
  const KEY = "notes";
  const load = () => JSON.parse(localStorage.getItem(KEY) || "[]");
  const save = (notes) => localStorage.setItem(KEY, JSON.stringify(notes));
  const render = () => {
    const list = document.getElementById("list"), notes = load();
    list.innerHTML = "";
    if (!notes.length) { list.innerHTML = '<li class="empty">No notes yet</li>'; return; }
    for (const n of notes) {
      const li = document.createElement("li"), span = document.createElement("span"), del = document.createElement("button");
      span.textContent = n.text;
      del.textContent = "Delete"; del.setAttribute("aria-label", "Delete " + n.text);
      del.onclick = () => { save(load().filter((x) => x.id !== n.id)); render(); };
      li.append(span, del); list.append(li);
    }
  };
  document.getElementById("add").onsubmit = (e) => {
    e.preventDefault();
    const input = document.getElementById("text"), text = input.value.trim(), err = document.getElementById("error");
    if (!text) { err.textContent = "A note cannot be empty"; return; }
    err.textContent = "";
    save([...load(), { id: Date.now().toString(36), text }]);
    input.value = ""; render();
  };
  render();
</script>
</body>
</html>
